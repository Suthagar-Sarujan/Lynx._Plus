version: "3.9"

# Fully open-source stack: MySQL + Redis + the Next.js web app + the BullMQ
# worker. For local development you'd usually run `docker compose up -d mysql
# redis` and then `npm run dev` / `npm run worker` on the host for fast
# reload; `docker compose up` (all services) gives you the whole thing in
# containers, closer to production.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lynx_news
      MYSQL_USER: lynx
      MYSQL_PASSWORD: lynx
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Optional: self-hosted open-source translation engine.
  # Uncomment if you want LibreTranslate running locally instead of a hosted mirror.
  # libretranslate:
  #   image: libretranslate/libretranslate:v1.6.0
  #   restart: unless-stopped
  #   ports:
  #     - "5000:5000"

  web:
    build: .
    restart: unless-stopped
    depends_on: [mysql, redis]
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/public/uploads
      - generated_data:/app/public/generated

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on: [mysql, redis]
    env_file: .env
    volumes:
      - uploads_data:/app/public/uploads
      - generated_data:/app/public/generated

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  generated_data:
